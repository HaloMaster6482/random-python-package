[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "random_package_python"
version = "0.1.0"
authors = [
    {name = "HaloMaster6482", email="ingenue-number-6o@icloud.com"}
]
description = "Random functions in a package."
readme = "README.md"
requires-python = ">=3.9"
